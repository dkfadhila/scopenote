name: ScopeNote health check

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scopenote-health-check
  cancel-in-progress: false

jobs:
  health:
    if: github.repository == 'dkfadhila/scopenote'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check production API
        shell: bash
        run: |
          response=$(curl --fail --silent --show-error \
            --proto '=https' --connect-timeout 15 --max-time 90 \
            --retry 1 --retry-delay 5 --retry-max-time 185 \
            https://scopenote.dktirta.tech/api/health)
          printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("status")=="ok", "API did not report healthy"'
          printf 'ScopeNote API is healthy.\n'
