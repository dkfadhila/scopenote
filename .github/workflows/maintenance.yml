name: ScopeNote maintenance

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: scopenote-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    if: github.repository == 'dkfadhila/scopenote'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retry receipts and delete expired private audio
        env:
          CRON_SECRET: ${{ secrets.SCOPENOTE_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --proto '=https' \
            --connect-timeout 15 --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://scopenote.dktirta.tech/api/internal/maintenance
