services:
  - type: web
    name: scopenote
    runtime: node
    plan: free
    domains:
      - scopenote.dktirta.tech
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: SESSION_SECRET
        generateValue: true
      - key: ACCOUNT_MODE
        value: 'true'
      - key: AI_DAILY_LIMIT
        value: '50'
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_ORIGIN
        value: https://scopenote.dktirta.tech
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: scopenote
      - key: SENTRY_DSN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_STT_MODEL
        value: scribe_v2
      - key: ALLSCALE_API_KEY
        sync: false
      - key: ALLSCALE_API_SECRET
        sync: false
      - key: ALLSCALE_CHECKOUT_ENABLED
        value: 'false'
